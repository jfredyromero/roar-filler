<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 380px; margin: 0; padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    button { font-size: 13px; padding: 8px 12px; margin: 0 6px 8px 0; cursor: pointer;
             border: 1px solid #ccc; border-radius: 6px; background: #f7f7f7; }
    button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    button:disabled { opacity: .5; cursor: default; }
    #log { margin-top: 10px; padding: 8px; background: #111; color: #ddd; border-radius: 6px;
           font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.5;
           max-height: 320px; overflow: auto; white-space: pre-wrap; }
    .hint { font-size: 12px; color: #666; margin: 0 0 6px; }
    #days { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    #days:empty, .hint:has(+ #days:empty) { display: none; }
    button.day { margin: 0; padding: 6px 10px; }
    button.day.on { background: #f0c674; border-color: #d4a72c; font-weight: 600; }
    .ok { color: #7ee787; } .err { color: #ff7b72; } .warn { color: #f0c674; } .skip { color: #9aa0a6; }
  </style>
</head>
<body>
  <h1>rOar Filler</h1>
  <p class="hint">Days with 2h of meetings (instead of 1h):</p>
  <div id="days"></div>
  <div id="actions">
    <button id="preview">Preview</button>
    <button id="run" class="primary">Fill week</button>
    <button id="reload">Reload page</button>
  </div>
  <div id="log">Ready. Use "Preview" to see the detected week without saving anything.</div>
  <script src="index.js"></script>
</body>
</html>
